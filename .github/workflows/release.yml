name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version and links come from the tag: the released module.json always points to its own archive,
      # and the manifest link always points to the latest release (Foundry checks it for updates).
      - name: Set version and links in module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPOSITORY_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg version "$VERSION"              --arg manifest "$REPOSITORY_URL/releases/latest/download/module.json"              --arg download "$REPOSITORY_URL/releases/download/$GITHUB_REF_NAME/module.zip"              '.version = $version | .manifest = $manifest | .download = $download' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md README.ru.md CHANGELOG.md CHANGELOG.ru.md assets lang packs scripts styles templates -x "*.DS_Store" -x "packs/*/LOCK"

      # Release notes: the CHANGELOG section of this version (from its heading to the next "## ").
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            /^## / { inside = index($0, "## " version) == 1; next }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          echo "Русский журнал изменений: CHANGELOG.ru.md" >> release-notes.md

      # A release with the same tag may already exist (for example, a re-tagged version): replace it entirely.
      - name: Remove previous release with this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Detective Story Reverse ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            module.zip
            module.json
